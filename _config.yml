title: Zhang Ye's Blog
description: 企业级系统架构、数据安全与 AI 应用实践，关注大模型落地和数字化转型
url: "https://zhangyeio.github.io"
baseurl: ""

author: Zhang Ye
lang: zh-CN
keywords: 企业级系统架构, 数据安全, 大模型应用, 数字化转型, 人工智能

theme: null
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

kramdown:
  auto_ids: false
  parse_block_html: false
  syntax_highlighter_opts:
    disable: true
  toc_levels: []
  html_to_native: true
  remove_block_html_tags: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
