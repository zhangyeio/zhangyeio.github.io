  </g><rect x="280" y="1080" width="1440" height="30" rx="15" fill="#243A68"/><text x="1000" y="1102" fill="#FFFFFF" font-size="17" font-weight="700" text-anchor="middle">场景不过门不立项｜影子运行不过门不上线｜责任人不明确不移交</text>
