    <foreignObject x="705" y="755" width="265" height="110">
      <div xmlns="http://www.w3.org/1999/xhtml" class="box-copy" style="color:#302A4E;text-align:center;">
        
        <div class="box-title" style="font-size:20px">FDE 负责人</div>
        <div class="box-lines" style="font-size:15px"><div class="line">现场诊断 · 范围 · 节奏</div><div class="line">连接业务与技术</div></div>
      </div>
    </foreignObject>
  </g>
  <g>
    <rect x="1010" y="745" width="285" height="130" rx="16" fill="#DDEFE5" stroke="#3C8061" stroke-width="2"/>
    <foreignObject x="1020" y="755" width="265" height="110">
      <div xmlns="http://www.w3.org/1999/xhtml" class="box-copy" style="color:#173E2E;text-align:center;">
        
