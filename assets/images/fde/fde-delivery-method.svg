        <div class="box-title" style="font-size:20px">应用交付工程师</div>
        <div class="box-lines" style="font-size:15px"><div class="line">Agent · 工作流 · 工具</div><div class="line">测试 · 上线 · 运维</div></div>
      </div>
    </foreignObject>
  </g>
