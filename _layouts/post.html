---
layout: default
---
<article class="post{% if page.series %} post-series post-series-{{ page.series | escape }}{% endif %}">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    <p class="post-meta">
      {{ page.date | date: "%Y-%m-%d" }}
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
