<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111214">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/dark-theme.css' | relative_url }}">
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.dataset.siteTheme = 'dark';
          }
        } catch (error) {
          // Keep the light theme when browser storage is unavailable.
        }
      }());
    </script>
    <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到正文</a>

    <nav class="site-nav" aria-label="主导航">
      <a class="site-brand" href="{{ '/' | relative_url }}">Ye's Log</a>
      <div class="site-nav-actions">
        <button class="theme-toggle" type="button" aria-label="切换为深色主题" aria-pressed="false" title="切换主题">
          <span class="theme-icon theme-icon-moon" aria-hidden="true">☾</span>
          <span class="theme-icon theme-icon-sun" aria-hidden="true">☀</span>
        </button>
        <span class="nav-divider" aria-hidden="true">|</span>
        <a href="{{ '/' | relative_url }}">Posts</a>
        <a href="{{ '/archive' | relative_url }}">Archive</a>
        <a href="{{ '/about' | relative_url }}">About</a>
      </div>
    </nav>

    <main id="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>© {{ site.time | date: '%Y' }} Zhang Ye</span>
      <span>Built with Jekyll and GitHub Pages.</span>
    </footer>
  </body>
</html>
